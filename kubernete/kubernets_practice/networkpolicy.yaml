apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-port80
  namespace: default

spec:
  # podSelector: {}

  # policyTypes:
  #   - Ingress
  #   - Egress
  
  egress:
    - ports:
        - port: 80
          # endPort: 85
          protocol: TCP

      to:
        - podSelector:
            matchLabels:
              app: pod111

  ingress:
    - ports:
        - port: 80
          # endPort: 85
          protocol: TCP

      from:
        - podSelector:
            matchLabels:
              app: pod333
  podSelector:
    matchLabels:
      app: networkpolicy1