apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: sid
spec:
  containers:
  - name: app
    image: halverneus/static-file-server
    ports:
      - containerPort: 8080
    volumeMounts:
      - name: pvc-volume
        mountPath: /web
  volumes:
    - name: pvc-volume
      persistentVolumeClaim:
        claimName: azureblob-pvc

---

apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: sid
spec:
    containers:
    - name: candy
      image: caddy:2
      ports:
      - containerPort: 80
      volumeMounts:
      - name: video-storage
        mountPath: /usr/share/caddy
    volumes:
    - name: video-storage
      persistentVolumeClaim:
        claimName: azureblob-pvc