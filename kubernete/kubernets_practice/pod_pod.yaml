apiVersion: v1
kind: Pod
metadata:
  name: pod
spec:
  containers:
    - name: pod
      image: nginx

      volumeMounts:
        - mountPath: "/mnt/siddharth"
          name: azure

  volumes:
    - name: azure
      persistentVolumeClaim:
        claimName: pvc

