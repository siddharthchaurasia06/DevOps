apiVersion: v1
kind: Pod
metadata:
  name: nginx-azurefile
spec:
  containers:
    - name: app
      image: halverneus/static-file-server
      ports:
        - containerPort: 8080

      volumeMounts:
        - mountPath: /web
          name: azure-storage

  volumes:
    - name: azure-storage
      persistentVolumeClaim:
        claimName: azurefile-pvc